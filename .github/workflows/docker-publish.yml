name: Docker Publish

on:
  push:
    branches: [ "**" ] # Käivitub igal pushil ükskõik millisesse harusse

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Need õigused on vajalikud, et GITHUB_TOKEN saaks GHCR-i kirjutada
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Logime sisse automaatse ja alati saadaval oleva GITHUB_TOKEN'iga
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR nõuab, et repode nimed oleksid väiketähtedega. GitHubi kasutajanimed võivad aga olla suurtähtedega (nt Cougar).
      # See samm teeb "Cougar/raadio" nime kindlalt väiketäheliseks "cougar/raadio"-ks.
      - name: Lowercase the repository name and store to env
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> ${GITHUB_ENV}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Kui oleme 'main' harus: lisa 'latest' ja lühike giti räsi (nt 'sha-a1b2c3d')
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            # Kui oleme muus harus: kasuta ainult haru nime (nt 'feat-docker')
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
